[package]
name = "iso4-core"
version = "0.0.0"
edition = "2021"
description = "The iso4 engine: V8 isolates with memory/CPU limits, the warm registry, the prefix store. Encodes nothing, owns no socket"
license = "MIT"
publish = false

# Lib target: `server` links it; `benches/` reaches the value codec and V8
# helpers. Nothing outside this repository links it (publish = false above).
[lib]
name = "iso4_core"
path = "src/lib.rs"
bench = false

[[bench]]
name = "micro"
harness = false

[features]
# Test values for other crates' tests (`testval.rs`); never on in a build.
test-support = ["iso4-types/test-support"]

[dependencies]
iso4-types = { path = "../types" }

# Embedded V8 via the official rusty_v8 crate
v8 = "152.2"

# Lock-free channels between the run threads and the watchdog
crossbeam-channel = "0.5"

# POSIX bits: fcntl, pipe, poll, FD_CLOEXEC
libc = "0.2"

# WHATWG URL parsing for the sandbox URL class (src/url.rs) — ada, the parser
# Node.js itself uses, so component semantics match Node by construction. The
# crate vendors the ada C++ amalgamation and compiles it via `cc` at build
# time (C++20; every toolchain we build on qualifies).
ada-url = "4"

# Unicode XID tables for the host-module export name check (widened to ID in v8.rs).
unicode-ident = "1"

# build.rs compiles the runtime modules to create the startup snapshot, so it
# needs every dependency they use.
[build-dependencies]
iso4-types = { path = "../types" }
v8 = "152.2"
# Compiles src/clock_platform.cc against the vendored V8 headers.
cc = "1"
crossbeam-channel = "0.5"
libc = "0.2"
ada-url = "4"
unicode-ident = "1"

[dev-dependencies]
iso4-types = { path = "../types", features = ["test-support"] }
# Wall-time microbenchmarks (benches/micro.rs). Plots and rayon disabled:
# CI only needs `--output-format bencher` text output.
# CodSpeed drop-in layer: plain `cargo bench` behaves like criterion; under
# `cargo codspeed run` in CI the same benches are measured by instrumentation
# (.github/workflows/codspeed.yml).
criterion = { package = "codspeed-criterion-compat", version = "5.0", default-features = false, features = ["cargo_bench_support"] }
