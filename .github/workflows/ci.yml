name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # head of stable branch, 2026-08-05 (no release tags exist)
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/v8-runtime

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build debug binary + all TS packages. The debug binary is fast to
      # build and sufficient for running the integration and e2e test suites.
      - name: Build
        run: pnpm build:dev

      # Runs cargo test (Rust unit tests) + vitest across all packages,
      # including integration.test.ts and e2e.test.ts which spawn the binary.
      - name: Test
        run: pnpm test:run

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
