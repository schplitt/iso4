name: CI

permissions:
  contents: read

on:
  pull_request:

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/v8-runtime

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build debug binary + all TS packages. The debug binary is fast to
      # build and sufficient for running the integration and e2e test suites.
      - name: Build
        run: pnpm build:dev

      # Runs cargo test (Rust unit tests) + vitest across all packages,
      # including integration.test.ts and e2e.test.ts which spawn the binary.
      - name: Test
        run: pnpm test:run

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck
