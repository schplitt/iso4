name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # ── Build native binaries for every supported platform ───────────────────
  build-native:
    name: Build native (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            package: iso4-v8-darwin-arm64

          - platform: darwin-x64
            runner: macos-13
            target: x86_64-apple-darwin
            package: iso4-v8-darwin-x64

          - platform: linux-x64-gnu
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            package: iso4-v8-linux-x64-gnu

          - platform: linux-arm64-gnu
            runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            package: iso4-v8-linux-arm64-gnu
            cross: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/v8-runtime
          key: ${{ matrix.target }}

      - name: Install cross (arm64 only)
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        run: |
          ${{ matrix.cross && 'cross' || 'cargo' }} build --release \
            --target ${{ matrix.target }} \
            --manifest-path native/v8-runtime/Cargo.toml

      - name: Ad-hoc sign (macOS only)
        if: runner.os == 'macOS'
        run: |
          codesign --sign - --force \
            native/v8-runtime/target/${{ matrix.target }}/release/iso4-v8

      - uses: actions/upload-artifact@v4
        with:
          name: iso4-v8-${{ matrix.platform }}
          path: native/v8-runtime/target/${{ matrix.target }}/release/iso4-v8
          if-no-files-found: error

  # ── Publish ───────────────────────────────────────────────────────────────
  publish:
    name: Publish
    needs: [build-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r --filter="./packages/*" build

      - name: Download all native binaries
        uses: actions/download-artifact@v4
        with:
          path: .artifacts

      - name: Place binaries in platform packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            dest="packages/iso4-v8-${platform}/bin"
            mkdir -p "$dest"
            cp ".artifacts/iso4-v8-${platform}/iso4-v8" "$dest/iso4-v8"
            chmod +x "$dest/iso4-v8"
          done

      - name: Create Release PR or Publish
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
