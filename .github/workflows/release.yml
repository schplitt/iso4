name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Runs on every push to main.
  # When there are pending changesets → creates/updates the "Version Packages" PR.
  # When the Version Packages PR is merged (no pending changesets) → hasChangesets
  # is 'false' and the build-native + publish jobs below kick in.
  changeset:
    name: Version PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.cs.outputs.hasChangesets }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        id: cs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Only runs when the Version Packages PR is merged (has_changesets == 'false').
  build-native:
    name: Build native (${{ matrix.platform }})
    needs: changeset
    if: needs.changeset.outputs.has_changesets == 'false' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64,    runner: macos-latest,  target: aarch64-apple-darwin }
          - { platform: darwin-x64,      runner: macos-latest,  target: x86_64-apple-darwin }
          - { platform: linux-x64-gnu,   runner: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { platform: linux-arm64-gnu, runner: ubuntu-latest, target: aarch64-unknown-linux-gnu, cross: true }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: native/v8-runtime
          key: release-${{ matrix.target }}
      - if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross
      - run: |
          ${{ matrix.cross && 'cross' || 'cargo' }} build --release \
            --target ${{ matrix.target }} \
            --manifest-path native/v8-runtime/Cargo.toml
      - if: runner.os == 'macOS'
        run: codesign --sign - --force native/v8-runtime/target/${{ matrix.target }}/release/iso4-v8
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: iso4-v8-${{ matrix.platform }}
          path: native/v8-runtime/target/${{ matrix.target }}/release/iso4-v8
          if-no-files-found: error

  publish:
    name: Publish
    needs: [changeset, build-native]
    if: needs.changeset.outputs.has_changesets == 'false' && startsWith(github.event.head_commit.message, 'Version Packages')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write  # required for npm OIDC trusted publishing
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --filter="./packages/*" build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: .artifacts
      - name: Place binaries in platform packages
        run: |
          for platform in darwin-arm64 darwin-x64 linux-x64-gnu linux-arm64-gnu; do
            dest="packages/iso4-v8-${platform}/bin"
            mkdir -p "$dest"
            cp ".artifacts/iso4-v8-${platform}/iso4-v8" "$dest/iso4-v8"
            chmod +x "$dest/iso4-v8"
          done
      - name: Publish to npm + create GitHub Releases
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
