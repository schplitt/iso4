name: Benchmarks

# Benchmark reporting, two jobs:
#
#   1. `baseline` (push to main): run both suites against the release binary
#      and store the numbers in the Actions cache (key
#      `bench-baseline-<sha>`). Caches written on the default branch are
#      readable from every PR branch, so this is the shared baseline store —
#      no gh-pages, no extra branch.
#
#   2. `pr` (pull requests): restore the most recent main baseline, run both
#      suites on the PR head, and post a comparison table as a sticky PR
#      comment (updated in place on every push to the PR).
#
# Interpretation caveat (also printed in the comment): baseline and PR run
# on DIFFERENT shared VMs, which carry 10-30% wall-time variance. Deltas
# inside that band are noise; the comment flags only >30% slowdowns. For a
# trustworthy verdict on a specific optimization, rerun locally:
# scripts/bench-compare.ts works on any two result directories.
#
# Suites:
#   A — Node end-to-end: `pnpm bench:json` (vitest bench) in
#       packages/iso4-sandbox, transformed by scripts/bench-transform.ts.
#       Runs against the RELEASE native binary (`pnpm build`) — debug
#       binary numbers are meaningless.
#   B — Rust micro: criterion benches in native/v8-runtime/benches/,
#       `--output-format bencher` (parsed by scripts/bench-compare.ts).
#
# Both jobs use identical build flags and full sample counts so the stored
# baseline is comparable with PR runs.
#
# All third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline (main)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-03
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/v8-runtime

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Release binary — bench discipline: never bench a debug iso4-v8.
      - name: Build (release)
        run: pnpm build

      - name: Suite A — Node end-to-end (vitest bench)
        run: |
          pnpm bench:json
          mkdir -p bench-baseline
          node scripts/bench-transform.ts packages/iso4-sandbox/bench-results.json bench-baseline/node.json

      - name: Suite B — Rust micro (criterion)
        # pipefail: without it, `| tee` would mask a cargo bench failure and
        # store an empty baseline.
        run: |
          set -euo pipefail
          mkdir -p bench-baseline
          cargo bench --manifest-path native/v8-runtime/Cargo.toml -- --output-format bencher | tee bench-baseline/rust.txt

      - name: Stamp baseline metadata
        run: |
          printf '{"sha":"%s","ref":"%s","date":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            > bench-baseline/meta.json
          cat bench-baseline/meta.json

      - name: Store baseline
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bench-baseline
          key: bench-baseline-${{ github.sha }}

  pr:
    name: PR vs main baseline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-03
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/v8-runtime

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 26

      # Most recent main baseline via prefix match. A miss is fine (first
      # run, or cache evicted): the comment then shows PR numbers only and
      # the next push to main repopulates the baseline.
      - name: Restore main baseline
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bench-baseline
          key: bench-baseline-
          restore-keys: |
            bench-baseline-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (release)
        run: pnpm build

      - name: Bench PR head
        run: |
          set -euo pipefail
          mkdir -p bench-pr
          pnpm bench:json
          node scripts/bench-transform.ts packages/iso4-sandbox/bench-results.json bench-pr/node.json
          cargo bench --manifest-path native/v8-runtime/Cargo.toml -- --output-format bencher | tee bench-pr/rust.txt

      - name: Compare against baseline
        run: |
          node scripts/bench-compare.ts bench-baseline bench-pr > "$RUNNER_TEMP/bench-comment.md"
          cat "$RUNNER_TEMP/bench-comment.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token — the report still lands in the job
      # summary above, only the sticky comment is skipped.
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/bench-comment.md`, 'utf8')
            const marker = '<!-- iso4-bench-ab -->'
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(c => c.body && c.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              })
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              })
            }
