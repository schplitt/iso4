name: CodSpeed

# Instrumented (simulation-mode) benchmarks via CodSpeed — deterministic CPU
# measurement, immune to runner noise. This is the only benchmark workflow:
#
#   - Covered here: everything that runs IN-PROCESS in the measured process —
#     the Rust criterion micro suite (native/v8-runtime/benches/) and the
#     host-side codec benches (bench/codec.bench.ts). Push to main sets the
#     baseline; every PR push gets a diff comment from the CodSpeed GitHub
#     app, with ~1-2 % regression resolution.
#
#   - NOT covered: the two-process end-to-end suites (matrix/runtime/warm/
#     eviction.bench.ts). Those spawn the iso4-v8 child process and wait on
#     a Unix socket, so instrumenting the vitest process would measure only
#     the host-side slice. They are wall-time only: bench both sides
#     back-to-back on the same idle machine and compare with
#     scripts/bench-compare.ts. Putting them in CI needs stable dedicated
#     hardware — CodSpeed's walltime macro runners require a GitHub org
#     (this repo is on a personal account) and a standing bench box wasn't
#     worth the cost yet; decided 2026-08-21 (#67), revisit when the perf
#     lab (Node-version matrix) becomes real.
#
# Auth is OIDC (id-token: write) — no long-lived token. The repo must be
# added on https://codspeed.io for reports/comments to appear.
#
# All third-party actions are pinned to commit SHAs.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codspeed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: CodSpeed (simulation)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable branch 2026-03
        with:
          toolchain: stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: native/v8-runtime

      - name: Install cargo-codspeed
        uses: taiki-e/install-action@899b013517f9e7774591216672bf75a46bb9a481 # v2.9.4
        with:
          tool: cargo-codspeed

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      # Node 24, not 26: @codspeed/core's prebuilt measurement addon links
      # v8::String::Utf8Length(Isolate*), which Node 26's V8 removed — the
      # vitest workers die with a symbol lookup error there. Node 24 (>= the
      # repo's engines floor) still exports it. Revisit when codspeed-node
      # ships Node-26-compatible prebuilds.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      # The codec benches import src/v8-codec.ts directly — no native binary
      # or package build needed for this suite.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build outside the instrumented step so compilation isn't measured.
      - name: Build benches (codspeed profile)
        run: cd native/v8-runtime && cargo codspeed build

      - name: Run benchmarks
        uses: CodSpeedHQ/action@d4c3ecc6c52771046d80d8575a8d9e6487fda279 # v5.0.3
        with:
          mode: simulation
          run: |
            cd native/v8-runtime && cargo codspeed run && cd ../..
            pnpm --filter @iso4/sandbox exec vitest bench --run codec
