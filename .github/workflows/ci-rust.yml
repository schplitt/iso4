name: CI (Rust)

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'native/**'
      - '.github/workflows/ci-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'native/**'
      - '.github/workflows/ci-rust.yml'

defaults:
  run:
    working-directory: native/v8-runtime

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        # Reads `rust-toolchain.toml`, installs the pinned channel plus
        # the `rustfmt` and `clippy` components declared there.
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        # The v8 crate downloads a prebuilt libv8_monolith.a — caching it
        # turns cold CI runs from ~5 min into ~30 s.
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/v8-runtime

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        # Treat warnings as errors so style/lints can't drift into main.
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo check
        # Debug profile is fine for CI — we just want a compile signal.
        # The release build runs in the per-platform release workflow
        # when binaries are actually being shipped.
        run: cargo check --all-targets
