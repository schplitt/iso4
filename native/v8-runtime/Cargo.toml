[package]
name = "iso4-v8-runtime"
version = "0.0.0"
edition = "2021"
description = "V8 host process for iso4 — runs sandboxed JavaScript with memory/CPU limits over a Unix domain socket"
license = "MIT"
publish = false

[[bin]]
name = "iso4-v8"
path = "src/main.rs"
# `cargo bench` must run only the criterion target below — the default
# libtest harness rejects criterion's `--output-format bencher` flag.
bench = false

# Lib target so `benches/` can reach the wire codec and V8 helpers.
# Nothing outside this repository links it (publish = false above).
[lib]
name = "iso4_v8_runtime"
path = "src/lib.rs"
bench = false

[[bench]]
name = "micro"
harness = false

[dependencies]
# Embedded V8 via the official rusty_v8 crate
v8 = "147"

# Lock-free channels between session, writer, and timeout threads
crossbeam-channel = "0.5"

# Async-signal-safe SIGTERM/SIGINT handling via self-pipe
signal-hook = "0.3"

# POSIX bits: fcntl, pipe, poll, FD_CLOEXEC
libc = "0.2"

# WHATWG URL parsing for the sandbox URL class (src/url.rs) — ada, the parser
# Node.js itself uses, so component semantics match Node by construction. The
# crate vendors the ada C++ amalgamation and compiles it via `cc` at build
# time (C++20; every toolchain we build on qualifies).
ada-url = "4"

[dev-dependencies]
# Wall-time microbenchmarks (benches/micro.rs). Plots and rayon disabled:
# CI only needs `--output-format bencher` text output.
# CodSpeed drop-in layer: plain `cargo bench` behaves like criterion (so
# bench.yml's bencher output is unchanged); under `cargo codspeed run` in CI
# the same benches are measured by instrumentation (.github/workflows/codspeed.yml).
criterion = { package = "codspeed-criterion-compat", version = "5.0", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
# LTO and panic=abort produce a smaller, faster binary with no unwinding tables
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
